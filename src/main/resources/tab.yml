# ============================================================
#  NickBook - Tab module (header/footer, tab names, nametags, sorting)
# ============================================================
# Same colors and placeholders as chat.yml ({name}, {prefix}, %papi%, {animation:x}, ...).
# Everything is nick aware: nicked players show their nick name + nick rank.
# ============================================================

enabled: true

# If the TAB plugin (NEZNAMY) is installed, turn this module off and let TAB do it
# (use %nickbook_prefix% / %nickbook_name% / %nickbook_suffix% in TAB's groups.yml).
disable-if-tab-plugin-installed: true

# Ticks between updates (20 = 1 second). Only changed values are sent to players.
update-interval: 10

group-source: luckperms
nicked-group: default

# Worlds where NickBook doesn't touch the tab list.
disabled-worlds: []

header-footer:
  enabled: true
  header:
    - ""
    - "{animation:title}"
    - "&7Welcome, &f{name}"
    - ""
  footer:
    - ""
    - "&7Online: &a{online}&7/&a{max}  &8|  &7Ping: &a{ping}ms  &8|  &7TPS: &a{tps}"
    - "&7{date} &8- &7{time}"
    - "&bplay.myserver.net"
    - ""

# Override header/footer per world (optional).
per-world:
  world_nether:
    header:
      - ""
      - "&c&lTHE NETHER"
      - ""

tabname:
  enabled: true
  default-format: "{prefix}{name}"
  max-length: 0              # 0 = no limit (set 16 for very old clients)

# Nametag above the head (prefix/suffix). Max 16 chars each on 1.8-1.12.
nametags:
  enabled: true
  visibility: always         # always | never | hide-for-other-teams | hide-for-own-team

# Tab list order: lower "sort" = higher in the list.
sorting:
  enabled: true
  alphabetical: true         # sort by name inside the same group

# Per group look. Group names should match LuckPerms groups (case insensitive).
groups:
  admin:
    priority: 100
    sort: 1
    tabname: "&8[&cAdmin&8] {prefix}{name}"
    tagprefix: "&c[Admin] "
    tagsuffix: ""
  helper:
    priority: 80
    sort: 5
    tabname: "&8[&9Helper&8] {prefix}{name}"
    tagprefix: "&9[Helper] "
    tagsuffix: ""
  mvp:
    priority: 20
    sort: 10
    tabname: "{prefix}{name}"
    tagprefix: "{prefix}"
    tagsuffix: "{suffix}"
  vip:
    priority: 10
    sort: 20
    tabname: "{prefix}{name}"
    tagprefix: "{prefix}"
    tagsuffix: "{suffix}"
  default:
    priority: 0
    sort: 50
    tabname: "{prefix}{name}"
    tagprefix: "{prefix}"
    tagsuffix: "{suffix}"

# Yellow number next to names in tab. type: ping | health | level | placeholder
tab-objective:
  enabled: false
  type: ping
  value: "%player_level%"    # used when type: placeholder
  title: "&eMS"

# Number under the nametag.
belowname:
  enabled: false
  type: health
  value: ""
  title: "&c\u2764"

# Animations, use anywhere as {animation:<name>} (also %nickbook_animation_<name>%).
# interval is in milliseconds.
animations:
  title:
    interval: 300
    frames:
      - "&6&lMY SERVER"
      - "&e&lMY SERVER"
      - "&f&lMY SERVER"
      - "&e&lMY SERVER"
  dots:
    interval: 500
    frames:
      - "&7."
      - "&7.."
      - "&7..."
